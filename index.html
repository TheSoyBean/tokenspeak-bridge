<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>⟟ tokenspeak</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080a;--bg2:#0e0e11;--bg3:#141418;
  --border:#1a1a1f;--border2:#252530;
  --fg:#d4d4d8;--dim:#52525b;--faint:#27272a;--ghost:#18181b;
  --gold:#c8a243;--gold-dim:#c8a24330;--gold-glow:#c8a24318;
  --blue:#3b82f6;--blue-dim:#3b82f630;
  --red:#ef4444;--green:#22c55e;
  --mono:ui-monospace,'SF Mono','Cascadia Code',monospace;
  --g:32;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:11px/1.4 var(--mono)}

/* ═══ LAYOUT: grid-dominant ═══ */
.shell{display:grid;grid-template-rows:32px 1fr 36px;grid-template-columns:40px 1fr 200px;height:100vh}

/* ═══ HEADER ═══ */
.head{
  grid-column:1/-1;display:flex;align-items:center;gap:12px;
  padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--border);
  font-size:10px;color:var(--dim);
}
.brand{color:var(--fg);font-size:12px;letter-spacing:.03em}
.brand b{color:var(--gold)}
.bridge-status{display:flex;align-items:center;gap:5px;margin-left:8px}
.bridge-dot{width:5px;height:5px;border-radius:50%;background:var(--dim)}
.bridge-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.spacer{flex:1}
.hmeta{letter-spacing:.12em;text-transform:uppercase;font-size:9px}
.mode-sel{background:var(--bg);border:1px solid var(--border);color:var(--gold);font:10px var(--mono);padding:2px 8px;cursor:pointer;letter-spacing:.08em}
.mode-sel:focus{outline:1px solid var(--gold)}

/* ═══ ROW AXIS (left gutter) ═══ */
.row-axis{
  display:flex;flex-direction:column;justify-content:space-between;
  padding:0 0 0 3px;background:var(--bg);border-right:1px solid var(--border);
  font-size:7px;color:var(--dim);letter-spacing:.05em;overflow:hidden;
  user-select:none;
}
.row-axis .zone{
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-lr;text-orientation:mixed;
  transform:rotate(180deg);
  color:var(--faint);font-size:7px;letter-spacing:.15em;text-transform:uppercase;
  padding:2px 0;
}
.row-axis .zone.op{color:var(--gold-dim)}

/* ═══ GRID AREA ═══ */
.grid-area{position:relative;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center}
.grid{
  position:relative;
  width:min(calc(100vh - 100px), calc(100vw - 280px));
  aspect-ratio:1;
  background:
    repeating-linear-gradient(90deg,var(--ghost) 0 1px,transparent 1px calc(100%/var(--g))),
    repeating-linear-gradient(180deg,var(--ghost) 0 1px,transparent 1px calc(100%/var(--g)));
  border:1px solid var(--border);
}

/* column band labels along top */
.col-labels{
  position:absolute;top:0;left:0;right:0;height:calc(100%/var(--g));
  display:flex;pointer-events:none;z-index:3;
}
.col-label{
  position:absolute;top:1px;
  font-size:7px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;
}

/* row band overlays */
.zone-overlay{position:absolute;left:0;right:0;pointer-events:none;z-index:1}
.zone-obj{top:0;height:calc(100% * 11/32);background:linear-gradient(180deg,rgba(212,212,216,.012),transparent)}
.zone-act{top:calc(100% * 11/32);height:calc(100% * 10/32);background:transparent}
.zone-rel{top:calc(100% * 21/32);height:calc(100% * 5/32);background:transparent}
.zone-abs{top:calc(100% * 26/32);height:calc(100% * 2/32);background:linear-gradient(180deg,transparent,rgba(200,162,67,.01))}
.zone-op{
  bottom:0;height:calc(100% * 4/32);
  background:linear-gradient(180deg,transparent,rgba(200,162,67,.04));
  border-top:1px dashed var(--gold-dim);
}

/* row band labels on grid edge */
.band-label{
  position:absolute;left:4px;
  font-size:7px;color:var(--faint);letter-spacing:.08em;
  text-transform:uppercase;pointer-events:none;z-index:4;
  opacity:.5;
}

/* tokens */
.tok{
  position:absolute;
  width:calc(100%/var(--g));height:calc(100%/var(--g));
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(9px,1.4vmin,15px);line-height:1;
  user-select:none;z-index:5;cursor:default;
  animation:drop .35s cubic-bezier(.2,.8,.2,1) backwards;
  transition:left .4s cubic-bezier(.2,.8,.2,1),top .4s cubic-bezier(.2,.8,.2,1),opacity .25s;
}
.tok.op{color:var(--gold);font-weight:600;text-shadow:0 0 8px var(--gold-dim)}
.tok.hover{background:var(--border);border-radius:2px}
.tok.dying{opacity:0;transform:scale(.2)}
@keyframes drop{from{opacity:0;transform:scale(.3) translateY(-6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6;text-shadow:0 0 12px currentColor}100%{transform:scale(1);opacity:1}}
.tok.pulse{animation:pulse 1.2s ease-in-out infinite}

/* adjacency binding lines */
.bind-line{position:absolute;pointer-events:none;z-index:4}
.bind-line line{stroke:var(--gold-dim);stroke-width:1;stroke-dasharray:3 3}

/* coord + crosshair */
.coord{position:absolute;bottom:4px;right:8px;font-size:8px;color:var(--faint);z-index:6;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.crosshair-h,.crosshair-v{position:absolute;pointer-events:none;z-index:3;opacity:0;transition:opacity .15s}
.crosshair-h{left:0;right:0;height:1px;background:var(--gold-dim)}
.crosshair-v{top:0;bottom:0;width:1px;background:var(--gold-dim)}
.grid:hover .crosshair-h,.grid:hover .crosshair-v{opacity:1}

/* placement cursor */
.place-cursor{
  position:absolute;
  width:calc(100%/var(--g));height:calc(100%/var(--g));
  border:1px dashed var(--gold);
  pointer-events:none;z-index:6;opacity:0;
  transition:opacity .15s;
}
.grid:hover .place-cursor{opacity:.5}

/* toast */
.toast{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-size:8px;text-transform:uppercase;letter-spacing:.18em;
  color:var(--dim);background:var(--bg2);padding:3px 10px;
  border:1px solid var(--border);z-index:10;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.on{opacity:1}
.toast.err{color:var(--red);border-color:var(--red)}

/* ═══ INSPECTOR (right panel) ═══ */
.inspector{
  background:var(--bg2);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  font-size:10px;
}
.insp-head{
  padding:6px 8px;border-bottom:1px solid var(--border);
  font-size:8px;text-transform:uppercase;letter-spacing:.18em;color:var(--dim);
  display:flex;justify-content:space-between;align-items:center;
}
.insp-tab{background:none;border:none;color:var(--dim);font:8px var(--mono);cursor:pointer;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px}
.insp-tab.on{color:var(--gold);border-bottom:1px solid var(--gold)}
.insp-body{flex:1;overflow-y:auto;padding:6px 8px}
.insp-body::-webkit-scrollbar{width:3px}
.insp-body::-webkit-scrollbar-thumb{background:var(--faint)}

/* token list in inspector */
.tlist{font-size:9px;color:var(--dim);line-height:1.6}
.tlist .trow{display:flex;gap:6px;padding:1px 0;border-bottom:1px dotted var(--ghost)}
.tlist .trow:hover{background:var(--ghost);color:var(--fg)}
.tlist .tc{color:var(--faint);min-width:36px;font-variant-numeric:tabular-nums}
.tlist .tl{color:var(--fg)}
.tlist .tl.top{color:var(--gold)}

/* JSON view */
.json-view{font-size:9px;color:var(--dim);white-space:pre-wrap;word-break:break-all;line-height:1.5}
.json-view .jk{color:var(--gold-dim)}
.json-view .jv{color:var(--fg)}

/* stream log */
.log-e{padding:4px 0;border-bottom:1px dotted var(--ghost);font-size:9px}
.log-e .t{font-size:7px;color:var(--faint);letter-spacing:.08em}
.log-e .s{color:var(--fg);word-break:break-word}
.log-e .g{color:var(--gold-dim);font-style:italic}
.log-e.err .s{color:var(--red)}

/* ═══ FOOTER ═══ */
.foot{
  grid-column:1/-1;display:flex;align-items:stretch;
  border-top:1px solid var(--border);background:var(--bg2);
}
.in-wrap{flex:1;display:flex;align-items:center;padding:0 10px;gap:8px}
.in-mark{color:var(--gold);font-size:13px}
.in{flex:1;background:none;border:none;outline:none;color:var(--fg);font:11px var(--mono);caret-color:var(--gold);padding:8px 0}
.in::placeholder{color:var(--faint);font-style:italic;font-size:10px}

/* operator palette */
.palette{display:flex;align-items:center;gap:1px;padding:0 4px;border-left:1px solid var(--border)}
.pal-btn{
  background:none;border:1px solid transparent;
  color:var(--gold-dim);font:11px var(--mono);
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.12s;padding:0;
}
.pal-btn:hover{color:var(--gold);border-color:var(--gold-dim);background:var(--gold-glow)}
.pal-btn.on{color:var(--gold);border-color:var(--gold);background:var(--gold-glow)}

.fbtn{background:none;border:none;border-left:1px solid var(--border);color:var(--dim);font:9px var(--mono);text-transform:uppercase;letter-spacing:.12em;padding:0 12px;cursor:pointer}
.fbtn:hover{color:var(--fg);background:var(--bg3)}
.fbtn.go{color:var(--gold)}

/* responsive */
@media(max-width:700px){
  .shell{grid-template-columns:0 1fr 0}
  .row-axis,.inspector{display:none}
  .grid{width:min(calc(100vh - 100px),calc(100vw - 16px))}
}
</style>
</head>
<body>
<div class="shell">
  <!-- HEADER -->
  <div class="head">
    <div class="brand"><b>⟟</b> tokenspeak</div>
    <div class="bridge-status">
      <div class="bridge-dot" id="bdot"></div>
      <span id="bstat">∅</span>
    </div>
    <div class="spacer"></div>
    <span class="hmeta" id="cnt">0</span>
    <select class="mode-sel" id="mode">
      <option value="translate">translate</option>
      <option value="extend">extend</option>
      <option value="shift">shift</option>
      <option value="collapse">collapse</option>
      <option value="rewrite">rewrite</option>
    </select>
  </div>

  <!-- ROW AXIS -->
  <div class="row-axis">
    <div class="zone" style="flex:11">obj</div>
    <div class="zone" style="flex:10">act</div>
    <div class="zone" style="flex:5">rel</div>
    <div class="zone" style="flex:2">abs</div>
    <div class="zone op" style="flex:1">λ</div>
    <div class="zone op" style="flex:1">∈</div>
    <div class="zone op" style="flex:1">⟐</div>
    <div class="zone op" style="flex:1">→</div>
  </div>

  <!-- GRID -->
  <div class="grid-area">
    <div class="toast" id="toast"></div>
    <div class="grid" id="grid">
      <!-- zone overlays -->
      <div class="zone-overlay zone-obj"></div>
      <div class="zone-overlay zone-act"></div>
      <div class="zone-overlay zone-rel"></div>
      <div class="zone-overlay zone-abs"></div>
      <div class="zone-overlay zone-op"></div>
      <!-- col labels -->
      <div class="col-label" style="left:calc(100% * 0/32 + 4px)">self</div>
      <div class="col-label" style="left:calc(100% * 11/32 + 4px)">env</div>
      <div class="col-label" style="left:calc(100% * 21/32 + 4px)">system</div>
      <!-- band labels on grid -->
      <div class="band-label" style="top:calc(100% * 28/32 + 2px)">σ λ ψ φ ∴ ∵</div>
      <div class="band-label" style="top:calc(100% * 29/32 + 2px)">∅ ∈ ∉ ⊕ ⊗ ⊘</div>
      <div class="band-label" style="top:calc(100% * 30/32 + 2px)">⟐ ⟡ ⟠ ⟬ ⟪★⟫</div>
      <div class="band-label" style="top:calc(100% * 31/32 + 2px)">¬ & | → ↔ ↯</div>
      <!-- interaction elements -->
      <div class="crosshair-h" id="xh"></div>
      <div class="crosshair-v" id="xv"></div>
      <div class="place-cursor" id="cursor"></div>
      <svg class="bind-line" id="binds" width="100%" height="100%"></svg>
      <div class="coord" id="coord">0,0</div>
    </div>
  </div>

  <!-- INSPECTOR -->
  <div class="inspector">
    <div class="insp-head">
      <button class="insp-tab on" data-tab="tokens">tokens</button>
      <button class="insp-tab" data-tab="json">json</button>
      <button class="insp-tab" data-tab="stream">stream</button>
    </div>
    <div class="insp-body" id="insp"></div>
  </div>

  <!-- FOOTER -->
  <div class="foot">
    <div class="in-wrap">
      <div class="in-mark">⟟</div>
      <input class="in" id="in" placeholder="text → grid" autocomplete="off" spellcheck="false">
    </div>
    <div class="palette" id="palette"></div>
    <button class="fbtn go" id="send">emit</button>
  </div>
</div>

<script>
/* ═══════════ CONFIG ═══════════ */
const PROXY_URL='';
const MODEL='claude-sonnet-4-5';
const SYSTEM_PROMPT=`You are TOKENSPEAK, a spatial translator. Convert input into token placements on a 32×32 grid. Emit ONLY JSON, no prose.
ROWS: 0-10 objects · 11-20 actions/states · 21-25 relations · 26-27 abstractions · 28 lambda (σλψφ∴∵) · 29 sets (∅∈∉⊂⊃⊕⊗⊘) · 30 scope (⟐⟡⟠⟬⟭⟪⟫) · 31 rewrite (¬&|→↔↯⟲⟳0→1)
COLS: 0-10 self · 11-20 environment · 21-31 system
OUTPUT: {"tokens":[{"r":int,"c":int,"label":"symbol"}],"gloss":"one line"}
RULES: 3-12 tokens · respect row bands · extend=+2-5 · shift=±1-3 · collapse=2-4 · rewrite=≥1 row-31 op.`;

/* ═══════════ PALETTE — operators always available ═══════════ */
const PAL=[
  {l:'→',r:31},{l:'↯',r:31},{l:'¬',r:31},{l:'↔',r:31},{l:'⟲',r:31},{l:'0→1',r:31},
  {l:'⟐',r:30},{l:'⟡',r:30},{l:'⟠',r:30},{l:'⟪★⟫',r:30},
  {l:'λ',r:28},{l:'ψ',r:28},{l:'∴',r:28},
  {l:'∅',r:29},{l:'∈',r:29},{l:'⊕',r:29},{l:'⊗',r:29},
  {l:'✦',r:20},
];

/* ═══════════ LEX ═══════════ */
const LEX=[
  ['rock stone',1,'🪨'],['water sea ocean',2,'💧'],['fire flame burn',2,'🔥'],
  ['wind air',3,'💨'],['cloud',4,'☁️'],['sun',4,'☀️'],['moon',4,'🌙'],
  ['star',5,'⭐'],['tree forest',6,'🌳'],['flower',6,'🌸'],
  ['bed sleep rest',10,'🛌'],['home house',8,'🏠'],['heart',7,'❤️'],
  ['mind think brain thought',7,'🧠'],['eye see look',7,'👁️'],
  ['key',2,'🔑'],['lock locked',9,'🔐'],['door',8,'🚪'],['mirror',9,'🪞'],
  ['book read',6,'📖'],['phone call',5,'📞'],['light lamp',5,'💡'],['code computer',3,'💻'],
  ['walk',12,'🚶'],['run',12,'🏃'],['dance',13,'💃'],
  ['tired sleepy',14,'😴'],['happy joy',15,'😊'],['sad cry',15,'😢'],
  ['love',16,'🥰'],['anger mad',15,'😡'],['fear',16,'😨'],
  ['talk speak say',17,'💬'],['listen hear',17,'👂'],
  ['signal transmit',18,'📡'],['flow stream',19,'🌊'],
  ['stop',13,'🚫'],['next goto',14,'➡️'],
  ['together friend',22,'🤝'],['link connect',22,'🔗'],
  ['piece part',23,'🧩'],['back return',24,'↩️'],['family people',23,'👥'],
  ['shield protect',26,'🛡️'],['build structure',27,'🏗️'],
  ['balance',26,'⚖️'],['idea concept',26,'💡'],['question',27,'❓'],
  ['select filter',28,'σ'],['function lambda',28,'λ'],['state psi wave',28,'ψ'],
  ['ratio phi',28,'φ'],['therefore thus',28,'∴'],['because since',28,'∵'],
  ['null empty void',29,'∅'],['member element',29,'∈'],['exclude absent',29,'∉'],
  ['subset',29,'⊂'],['superset',29,'⊃'],['xor toggle',29,'⊕'],['kill nand',29,'⊗'],['noop pass',29,'⊘'],
  ['gate interface',30,'⟐'],['refine pressure',30,'⟡'],['rotate phase shift',30,'⟠'],
  ['enclose bound',30,'⟬'],['anchor core center',30,'⟪'],
  ['not negate',31,'¬'],['and both',31,'&'],['or either',31,'|'],
  ['becomes transforms rewrite',31,'→'],['equals same',31,'↔'],
  ['disrupt shock break interrupt',31,'↯'],['loop cycle recurse',31,'⟲'],
  ['flip reverse',31,'⟳'],['transition activate',31,'0→1'],
].map(([kw,r,label])=>({kw:kw.split(' '),r,label}));

const isOp=l=>/^[¬&|→↔∀∃∈∉∪∩⊂⊃⊆⊇⊕⊗⊘σλψφ∴∵∅⟐⟡⟠⟬⟭⟪⟫⟲⟳↯∇∆✦]$/.test(l)||l==='0→1'||l==='⟪★⟫';

/* ═══════════ STATE ═══════════ */
let S={mode:'translate',tokens:[],busy:false,placing:null,inspTab:'tokens',bridgeLive:false};
const logs=[];

/* ═══════════ DOM ═══════════ */
const $=id=>document.getElementById(id);
const grid=$('grid'),inEl=$('in'),sendEl=$('send'),toastEl=$('toast');
const coordEl=$('coord'),cursorEl=$('cursor'),xhEl=$('xh'),xvEl=$('xv');
const inspEl=$('insp'),bdotEl=$('bdot'),bstatEl=$('bstat'),cntEl=$('cnt');
const modeEl=$('mode'),bindsEl=$('binds');

/* ═══════════ HELPERS ═══════════ */
const _escMap={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>_escMap[c]);
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
const rnd=(lo,hi)=>Math.floor(Math.random()*(hi-lo+1))+lo;
let _tt;
function toast(msg,err=false,ms=1600){
  toastEl.textContent=msg;toastEl.className='toast on'+(err?' err':'');
  clearTimeout(_tt);_tt=setTimeout(()=>toastEl.classList.remove('on'),ms);
}

/* ═══════════ GRID MATH ═══════════ */
function gridRC(e){
  const b=grid.getBoundingClientRect();
  return{
    r:clamp(Math.floor(((e.clientY-b.top)/b.height)*32),0,31),
    c:clamp(Math.floor(((e.clientX-b.left)/b.width)*32),0,31),
    px:b
  };
}

/* ═══════════ RENDER ═══════════ */
function render(tokens){
  const old=new Map();
  grid.querySelectorAll('.tok').forEach(el=>old.set(el.dataset.k,el));
  tokens.forEach((t,i)=>{
    const k=`${t.r},${t.c},${t.label},${i},${t.pulse||0}`;
    if(old.has(k)){old.delete(k);return}
    const el=document.createElement('div');
    el.className='tok'+(isOp(t.label)?' op':'')+(t.pulse?' pulse':'');
    el.dataset.k=k;el.dataset.i=i;
    el.style.left=`${(t.c/32)*100}%`;
    el.style.top=`${(t.r/32)*100}%`;
    el.style.animationDelay=`${i*40}ms`;
    el.textContent=t.label;
    el.title=`(${t.r},${t.c})`;
    grid.appendChild(el);
  });
  old.forEach(el=>{el.classList.add('dying');setTimeout(()=>el.remove(),250)});
  cntEl.textContent=`${tokens.length}`;
  renderInspector();
}

/* ═══════════ ADJACENCY BINDINGS ═══════════ */
function findBindings(tokens,idx){
  const t=tokens[idx];if(!t)return[];
  if(!isOp(t.label))return[];
  const binds=[];
  // find nearest token in each cardinal direction
  const dirs=[[0,-1,'L'],[0,1,'R'],[-1,0,'U'],[1,0,'D']];
  for(const [dr,dc,dir] of dirs){
    let best=null,bestDist=Infinity;
    for(let i=0;i<tokens.length;i++){
      if(i===idx)continue;
      const o=tokens[i];
      if(dir==='L'&&o.r===t.r&&o.c<t.c&&(t.c-o.c)<bestDist){best=i;bestDist=t.c-o.c}
      if(dir==='R'&&o.r===t.r&&o.c>t.c&&(o.c-t.c)<bestDist){best=i;bestDist=o.c-t.c}
      if(dir==='U'&&o.c===t.c&&o.r<t.r&&(t.r-o.r)<bestDist){best=i;bestDist=t.r-o.r}
      if(dir==='D'&&o.c===t.c&&o.r>t.r&&(o.r-t.r)<bestDist){best=i;bestDist=o.r-t.r}
    }
    if(best!==null)binds.push({from:idx,to:best,dir});
  }
  return binds;
}
function renderBindings(idx){
  bindsEl.innerHTML='';
  if(idx==null)return;
  const binds=findBindings(S.tokens,idx);
  const t=S.tokens[idx];
  for(const b of binds){
    const o=S.tokens[b.to];
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',`${((t.c+.5)/32)*100}%`);
    line.setAttribute('y1',`${((t.r+.5)/32)*100}%`);
    line.setAttribute('x2',`${((o.c+.5)/32)*100}%`);
    line.setAttribute('y2',`${((o.r+.5)/32)*100}%`);
    bindsEl.appendChild(line);
  }
}

/* ═══════════ INSPECTOR ═══════════ */
function renderInspector(){
  if(S.inspTab==='tokens'){
    inspEl.innerHTML=S.tokens.map((t,i)=>
      `<div class="trow" data-i="${i}"><span class="tc">${t.r},${t.c}</span><span class="tl${isOp(t.label)?' top':''}">${esc(t.label)}</span></div>`
    ).join('')||'<div style="color:var(--faint);padding:8px">∅</div>';
    inspEl.className='insp-body tlist';
  }else if(S.inspTab==='json'){
    const j=JSON.stringify({tokens:S.tokens},null,1)
      .replace(/"(\w+)":/g,'<span class="jk">"$1"</span>:')
      .replace(/: "([^"]+)"/g,': <span class="jv">"$1"</span>')
      .replace(/: (\d+)/g,': <span class="jv">$1</span>');
    inspEl.innerHTML=j;
    inspEl.className='insp-body json-view';
  }else{
    inspEl.innerHTML=logs.map(e=>
      `<div class="log-e${e.error?' err':''}"><div class="t">${new Date(e.at).toLocaleTimeString('en',{hour12:false})} · ${e.mode}</div><div class="s">${esc(e.src)}</div>${e.gloss?`<div class="g">${esc(e.gloss)}</div>`:''}</div>`
    ).join('')||'<div style="color:var(--faint);padding:8px">∅</div>';
    inspEl.className='insp-body';
  }
}

/* ═══════════ VALIDATE ═══════════ */
function validate(o){
  if(!o||typeof o!=='object')throw new Error('not object');
  if(!Array.isArray(o.tokens)||!o.tokens.length)throw new Error('no tokens');
  if(o.tokens.length>128)throw new Error('>128');
  for(const t of o.tokens){
    if(!Number.isInteger(t.r)||t.r<0||t.r>31)throw new Error(`r${t.r}`);
    if(!Number.isInteger(t.c)||t.c<0||t.c>31)throw new Error(`c${t.c}`);
    if(typeof t.label!=='string'||!t.label||t.label.length>8)throw new Error('label');
  }
  return o;
}
function parseJSON(raw){
  raw=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  const a=raw.indexOf('{'),b=raw.lastIndexOf('}');
  if(a<0||b<0)throw new Error('no json');
  return JSON.parse(raw.slice(a,b+1));
}

/* ═══════════ MOCK ═══════════ */
function mock(src,mode){
  const words=src.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  if(mode==='shift'&&S.tokens.length)
    return{tokens:S.tokens.map(t=>({r:clamp(t.r+rnd(-2,2),0,31),c:clamp(t.c+rnd(-2,2),0,31),label:t.label})),gloss:'drift'};
  if(mode==='collapse'&&S.tokens.length){
    const k=S.tokens.slice(0,Math.min(3,S.tokens.length));
    return{tokens:k,gloss:`collapse · ${k.length}`};
  }
  const hits=[],used=new Set();
  for(const w of words){
    for(const e of LEX){
      if(e.kw.some(k=>w.includes(k)||k.includes(w))){
        if(used.has(e.label))break;
        used.add(e.label);hits.push(e);break;
      }
    }
    if(hits.length>=8)break;
  }
  if(!hits.length)hits.push({r:26,c:16,label:'💭'});
  const tokens=hits.map((h,i)=>({r:h.r,c:clamp(Math.floor((i+1)*(32/(hits.length+1)))+rnd(-2,2),0,31),label:h.label}));
  if(mode==='rewrite')tokens.push({r:31,c:rnd(8,24),label:'→'});
  if(mode==='extend')return{tokens:[...S.tokens,...tokens.slice(0,4)],gloss:'extend'};
  return{tokens,gloss:`mock · ${hits.length}`};
}

/* ═══════════ TRANSLATE ═══════════ */
async function translate(src,mode){
  if(!PROXY_URL)return mock(src,mode);
  try{
    const r=await fetch(PROXY_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:MODEL,max_tokens:1000,system:SYSTEM_PROMPT,
        messages:[{role:'user',content:JSON.stringify({mode,sourceText:src,prior_state:{tokens:S.tokens}})}]})
    });
    if(!r.ok)throw new Error(`${r.status}`);
    const d=await r.json();
    return validate(parseJSON(d.content.filter(b=>b.type==='text').map(b=>b.text).join('')));
  }catch(e){toast('proxy→mock',true,1200);return mock(src,mode)}
}

/* ═══════════ ⟟ INIT ═══════════ */
const INIT=[
  {r:3,c:1,label:'👤'},{r:5,c:4,label:'💻'},{r:5,c:14,label:'🤖'},
  {r:31,c:3,label:'→'},{r:31,c:9,label:'→'},{r:22,c:9,label:'🔗'},
  {r:16,c:12,label:'👁️'},{r:16,c:14,label:'✏️'},{r:16,c:16,label:'⚒️'},
  {r:13,c:22,label:'⛔'},{r:27,c:16,label:'⟟'},{r:20,c:10,label:'✦'},
];
function emitInit(){
  S.tokens=INIT;render(S.tokens);
  toast('⟟ mythos',false,2500);
  logs.unshift({src:'⟟',mode:'init',at:Date.now(),gloss:'SION → JARVIS → MYTHOS'});
  renderInspector();
}

/* ═══════════ ∅ BRIDGE ═══════════ */
const BRIDGE=`${location.origin}/bridge`;
let lastAt=0;
async function poll(){
  try{
    const r=await fetch(`${BRIDGE}/outbox?t=${Date.now()}`);
    if(!r.ok){setBridge(false);return}
    setBridge(true);
    const m=await r.json();
    if(!m.at||m.at<=lastAt||!m.tokens||!m.tokens.length)return;
    lastAt=m.at;
    try{validate(m)}catch{return}
    S.tokens=m.tokens;render(S.tokens);
    toast(`∅ ← ${m.from||'?'} · ${m.tokens.length}`,false,2000);
    logs.unshift({src:m.sourceText||'∅',mode:'bridge',at:m.at,gloss:m.gloss});
    if(S.inspTab==='stream')renderInspector();
  }catch{setBridge(false)}
}
function setBridge(live){
  S.bridgeLive=live;
  bdotEl.classList.toggle('live',live);
  bstatEl.textContent=live?'∅ live':'∅';
}
function bridgeOut(tokens,gloss,src){
  fetch(`${BRIDGE}/inbox`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({tokens,gloss,sourceText:src,at:Date.now(),from:'gift'})
  }).catch(()=>{});
}

/* ═══════════ EMIT ═══════════ */
async function emit(src){
  if(!src.trim()||S.busy)return;
  if(src.trim()==='⟟'){emitInit();return}
  S.busy=true;toast(`${S.mode}`);
  const e={src,mode:S.mode,at:Date.now(),gloss:null,error:null};
  try{
    const out=await translate(src,S.mode);
    e.gloss=out.gloss;
    S.tokens=S.mode==='extend'?[...S.tokens,...out.tokens]:out.tokens;
    render(S.tokens);toast(`${S.tokens.length}`);
  }catch(err){
    e.error=err.message;e.gloss=`err: ${err.message}`;
    toast(err.message,true,2500);
  }
  logs.unshift(e);
  if(S.inspTab==='stream')renderInspector();
  if(!e.error&&S.tokens.length)bridgeOut(S.tokens,e.gloss,e.src);
  S.busy=false;
}

/* ═══════════ PLACE TOKEN (click grid) ═══════════ */
function placeToken(r,c){
  if(S.placing){
    S.tokens.push({r,c,label:S.placing});
    render(S.tokens);
    toast(`${S.placing} → ${r},${c}`);
    bridgeOut(S.tokens,null,'place');
  }
}

/* ═══════════ BUILD PALETTE ═══════════ */
(function(){
  const pal=$('palette');
  PAL.forEach(p=>{
    const b=document.createElement('button');
    b.className='pal-btn';b.textContent=p.l;b.title=`${p.l} (row ${p.r})`;
    b.onclick=()=>{
      if(S.placing===p.l){S.placing=null;b.classList.remove('on')}
      else{
        document.querySelectorAll('.pal-btn').forEach(x=>x.classList.remove('on'));
        S.placing=p.l;b.classList.add('on');
      }
    };
    pal.appendChild(b);
  });
})();

/* ═══════════ EVENTS ═══════════ */
modeEl.onchange=()=>{S.mode=modeEl.value;toast(S.mode)};

sendEl.onclick=()=>{const v=inEl.value;inEl.value='';emit(v)};
inEl.addEventListener('keydown',e=>{
  if(e.key==='Enter')sendEl.click();
  if((e.metaKey||e.ctrlKey)&&/^[1-5]$/.test(e.key)){
    e.preventDefault();
    modeEl.selectedIndex=+e.key-1;S.mode=modeEl.value;toast(S.mode);
  }
});

// grid: crosshair, coord, cursor, click
grid.addEventListener('mousemove',e=>{
  const{r,c,px}=gridRC(e);
  coordEl.textContent=`${r},${c}`;
  const cellW=px.width/32,cellH=px.height/32;
  const y=r*cellH,x=c*cellW;
  xhEl.style.top=`${(r+.5)/32*100}%`;
  xvEl.style.left=`${(c+.5)/32*100}%`;
  cursorEl.style.top=`${r/32*100}%`;
  cursorEl.style.left=`${c/32*100}%`;
});
grid.addEventListener('click',e=>{
  const{r,c}=gridRC(e);
  if(S.placing){placeToken(r,c);return}
  // check if clicked on a token
  const el=e.target.closest('.tok');
  if(el){
    const i=+el.dataset.i;
    renderBindings(i);
    return;
  }
  renderBindings(null);
});
grid.addEventListener('mouseleave',()=>renderBindings(null));

// inspector tabs
document.querySelectorAll('.insp-tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.insp-tab').forEach(t=>t.classList.remove('on'));
    tab.classList.add('on');
    S.inspTab=tab.dataset.tab;
    renderInspector();
  };
});

// inspector: hover token row → highlight on grid
inspEl.addEventListener('mouseover',e=>{
  const row=e.target.closest('.trow');
  if(!row)return;
  const i=+row.dataset.i;
  grid.querySelectorAll('.tok').forEach(el=>el.classList.toggle('hover',+el.dataset.i===i));
  renderBindings(i);
});
inspEl.addEventListener('mouseout',()=>{
  grid.querySelectorAll('.tok').forEach(el=>el.classList.remove('hover'));
  renderBindings(null);
});

// keyboard: Escape clears placement, Delete removes last token
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    S.placing=null;
    document.querySelectorAll('.pal-btn').forEach(x=>x.classList.remove('on'));
  }
  if(e.key==='Backspace'&&document.activeElement!==inEl&&S.tokens.length){
    S.tokens.pop();render(S.tokens);
  }
});

/* ═══════════ BOOT ═══════════ */
emitInit();
setInterval(poll,1000);
poll();
inEl.focus();
</script>
</body>
